<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Tab Tracker — ABC</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        /* ─── Reset + Base ─── */
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:16px;background:#f5f5f5;color:#222}
        button{font-family:inherit;cursor:pointer;border:none;background:none}
        input{font-family:inherit}

        /* ─── Layout ─── */
        #app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

        /* ─── Top Bar (tables) ─── */
        #topbar{
            display:flex;align-items:center;gap:8px;
            background:#2c1810;color:#fff;padding:0 12px;
            padding-top:env(safe-area-inset-top);
            min-height:56px;flex-shrink:0;
            z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.2)
        }
        #table-pills{display:flex;gap:6px;overflow-x:auto;flex:1;padding:8px 0;scrollbar-width:none}
        #table-pills::-webkit-scrollbar{display:none}
        .table-pill{
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            min-width:80px;height:40px;border-radius:8px;padding:0 12px;
            font-weight:600;font-size:14px;flex-shrink:0;transition:all 0.15s;
            background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.7)
        }
        .table-pill.has-tab{background:rgba(76,175,80,0.3);color:#a5d6a7}
        .table-pill.active{background:#e89537;color:#fff;box-shadow:0 2px 8px rgba(232,149,55,0.5)}
        .table-pill.has-tab.active{background:#4caf50;color:#fff;box-shadow:0 2px 8px rgba(76,175,80,0.5)}
        .table-pill:active{transform:scale(0.96)}
        .pill-name{font-size:14px}
        .pill-total{font-size:11px;opacity:0.8}

        .topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
        .topbar-right .user-name{font-size:13px;opacity:0.7}
        .topbar-right button{color:#fff;font-size:13px;padding:6px 10px;border-radius:6px;background:rgba(255,255,255,0.1)}

        /* ─── Main Area ─── */
        #main{display:flex;flex:1;overflow:hidden}

        /* ─── Sidebar (categories + products) ─── */
        #sidebar{
            width:55%;max-width:720px;min-width:300px;
            background:#fff;border-right:1px solid #e0e0e0;
            display:flex;flex-direction:column;overflow:hidden;
            transition:width 0.2s,max-width 0.2s,min-width 0.2s
        }
        #sidebar.collapsed{width:52px;max-width:52px;min-width:52px}
        #sidebar-toggle{
            display:flex;align-items:center;justify-content:center;
            width:100%;height:44px;background:#fafafa;border-bottom:1px solid #e0e0e0;
            font-size:18px;color:#666;flex-shrink:0
        }
        #sidebar-toggle:active{background:#eee}
        #sidebar-content{flex:1;overflow-y:auto;display:flex;flex-direction:column}
        #sidebar.collapsed #sidebar-content{display:none}

        /* ─── Search ─── */
        #search-bar{padding:8px;background:#fafafa;border-bottom:1px solid #e0e0e0;flex-shrink:0}
        #search-input{
            width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;
            font-size:15px;outline:none
        }
        #search-input:focus{border-color:#e89537}

        /* ─── Category Accordion ─── */
        .category{border-bottom:1px solid #f0f0f0}
        .category-header{
            display:flex;align-items:center;gap:8px;padding:12px 16px;
            font-size:15px;font-weight:700;color:#333;cursor:pointer;
            user-select:none;background:#fff
        }
        .category-header:active{background:#f5f5f5}
        .category-icon{font-size:20px}
        .category-name{flex:1}
        .category-count{font-size:12px;color:#999;font-weight:400}
        .category-arrow{font-size:12px;color:#999;transition:transform 0.2s}
        .category.open .category-arrow{transform:rotate(90deg)}

        .product-grid{
            display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
            gap:6px;padding:8px;display:none
        }
        .category.open .product-grid{display:grid}

        .product-tile{
            display:flex;flex-direction:column;align-items:center;text-align:center;
            border:1px solid #e0e0e0;border-radius:10px;overflow:hidden;
            background:#fff;cursor:pointer;transition:all 0.1s;
            min-height:130px
        }
        .product-tile:active{background:#fff8ed;border-color:#e89537;transform:scale(0.97)}
        .product-tile img{width:100%;height:70px;object-fit:cover;background:#f9f9f9}
        .product-tile .no-img{width:100%;height:70px;display:flex;align-items:center;justify-content:center;font-size:28px;background:#f9f9f9}
        .product-tile .p-name{padding:4px 4px 0;font-size:12px;font-weight:600;line-height:1.2;flex:1;display:flex;align-items:center}
        .product-tile .p-price{padding:2px 4px 6px;font-size:13px;font-weight:700;color:#e89537}

        /* ─── Bill Panel ─── */
        #bill-panel{
            flex:1;display:flex;flex-direction:column;
            background:#fafafa;overflow:hidden
        }
        #bill-header{
            display:flex;align-items:center;justify-content:space-between;
            padding:12px 16px;background:#fff;border-bottom:1px solid #e0e0e0;flex-shrink:0
        }
        #bill-header h2{font-size:18px;font-weight:700}
        #bill-header .tab-meta{font-size:13px;color:#999}
        #bill-content{flex:1;overflow-y:auto;padding:10px 12px;-webkit-overflow-scrolling:touch}

        .bill-empty{
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            height:100%;color:#aaa;text-align:center;gap:8px
        }
        .bill-empty .empty-icon{font-size:48px;opacity:0.3}
        .bill-empty p{font-size:15px}

        .bill-item{
            display:flex;align-items:center;gap:8px;
            background:#fff;border:1px solid #eee;border-radius:8px;
            padding:8px 10px;margin-bottom:6px
        }
        .bill-item .item-thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;flex-shrink:0;background:#f0f0f0}
        .bill-item .item-info{flex:1;min-width:0}
        .bill-item .item-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .bill-item .item-price{font-size:12px;color:#888}
        .bill-item .item-total{font-size:14px;font-weight:700;color:#333;flex-shrink:0}

        .qty-control{display:flex;align-items:center;gap:4px;flex-shrink:0}
        .qty-btn{
            width:32px;height:32px;border-radius:6px;font-size:18px;font-weight:700;
            display:flex;align-items:center;justify-content:center;
            background:#f0f0f0;color:#333
        }
        .qty-btn:active{background:#e0e0e0}
        .qty-btn.delete{background:#ffe0e0;color:#c62828}
        .qty-value{min-width:24px;text-align:center;font-size:15px;font-weight:700}

        /* ─── Bill Footer ─── */
        #bill-footer{
            background:#fff;border-top:1px solid #e0e0e0;
            padding:14px 20px;padding-bottom:calc(14px + env(safe-area-inset-bottom));
            flex-shrink:0
        }
        .total-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
        .total-label{font-size:14px;color:#666}
        .total-amount{font-size:24px;font-weight:800;color:#2c1810}

        .btn-shopify{
            width:100%;padding:18px 24px;border-radius:12px;
            background:linear-gradient(135deg,#4caf50,#2e7d32);color:#fff;
            font-size:18px;font-weight:700;letter-spacing:0.5px;
            box-shadow:0 2px 8px rgba(46,125,50,0.3);
            margin-bottom:4px
        }
        .btn-shopify:active{transform:scale(0.98)}
        .btn-shopify:disabled{background:#ccc;box-shadow:none}

        .shopify-success-banner,.shopify-error-banner{
            text-align:center;padding:32px 20px
        }
        .success-check{font-size:64px;margin-bottom:12px}
        .shopify-success-banner h2{color:#2e7d32;margin-bottom:12px;font-size:22px}
        .shopify-error-banner h2{color:#c62828;margin-bottom:8px}
        .shopify-success-banner p,.shopify-error-banner p{margin:4px 0;color:#666;font-size:14px}
        .success-detail{font-family:monospace;font-size:12px;color:#999;word-break:break-all}
        .success-total{font-size:20px !important;font-weight:700;color:#2c1810 !important;margin:12px 0 !important}
        .success-instruction{font-size:14px;color:#888;margin:8px 0 24px !important}
        .mock-badge{display:inline-block;background:#fff3cd;color:#856404;padding:4px 12px;border-radius:6px;font-size:11px;font-weight:600}
        .btn-back-floor{
            display:block;width:100%;padding:18px;border-radius:12px;
            background:linear-gradient(135deg,#e89537,#d4761a);color:#fff;
            font-size:18px;font-weight:700;letter-spacing:0.5px;
            box-shadow:0 4px 12px rgba(232,149,55,0.4);margin-top:8px
        }
        .btn-back-floor:active{transform:scale(0.97);background:#d4761a}

        /* ─── Login ─── */
        .login-page{display:flex;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,#2c1810,#5d3a1f)}
        .login-card{background:#fff;border-radius:16px;padding:36px 32px;width:360px;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,0.3)}
        .login-card h1{font-size:24px;text-align:center;margin-bottom:8px;color:#2c1810}
        .login-card .subtitle{text-align:center;color:#888;font-size:14px;margin-bottom:24px}
        .login-card input{width:100%;padding:14px;border:1px solid #ddd;border-radius:8px;font-size:16px;margin-bottom:12px;outline:none}
        .login-card input:focus{border-color:#e89537}
        .login-card button{width:100%;padding:14px;border-radius:8px;background:#e89537;color:#fff;font-size:16px;font-weight:700}
        .login-card button:active{background:#d4822b}
        .login-card .error{text-align:center;color:#c62828;font-size:14px;margin-bottom:12px}
        .login-card .logo{text-align:center;font-size:40px;margin-bottom:8px}

        /* ─── Admin ─── */
        .admin-page{padding:20px;max-width:1200px;margin:0 auto}
        .admin-page h1{font-size:22px;margin-bottom:16px;color:#2c1810}
        .admin-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:24px}
        .stat-card{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:16px;text-align:center}
        .stat-card .stat-value{font-size:28px;font-weight:800;color:#2c1810}
        .stat-card .stat-label{font-size:13px;color:#888;margin-top:4px}
        .admin-section{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:16px;margin-bottom:20px;overflow-x:auto}
        .admin-section h2{font-size:17px;margin-bottom:12px;color:#333}
        .admin-table{width:100%;border-collapse:collapse;font-size:14px}
        .admin-table th{text-align:left;padding:8px;border-bottom:2px solid #e0e0e0;color:#666;font-size:12px;text-transform:uppercase}
        .admin-table td{padding:8px;border-bottom:1px solid #f0f0f0}
        .admin-table img{width:36px;height:36px;border-radius:4px;object-fit:cover}
        .admin-actions{display:flex;gap:6px}
        .admin-actions button,.admin-actions a{padding:6px 12px;border-radius:6px;font-size:13px;text-decoration:none}
        .btn-toggle-on{background:#e8f5e9;color:#2e7d32}
        .btn-toggle-off{background:#fbe9e7;color:#c62828}
        .btn-sync{background:#2196f3;color:#fff;padding:10px 20px;border-radius:8px;font-weight:600;display:inline-block;margin-bottom:16px}
        .price-input{width:80px;padding:4px 8px;border:1px solid #ddd;border-radius:4px;font-size:13px}
        .back-link{display:inline-block;margin-bottom:16px;color:#666;text-decoration:none;font-size:14px}
    </style>
</head>
<body>
<div id="app">
    {% block content %}{% endblock %}
</div>
</body>
</html>
